name: Generate Keystore on Cloud

on:
  workflow_dispatch: # تشغيل يدوي بنقرة زر

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and Output Base64
        run: |
          # 1. إنشاء ملف المفتاح بكلمة مرور موحدة وقوية
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MySecurePass2026#" \
            -keypass "MySecurePass2026#" \
            -dname "CN=Admin, OU=Dev, O=WifiSync, C=YE"
          
          # 2. طباعة النص المشفر في سجلات البناء لنسخه
          echo "==================== انسخ النص التالي كاملاً ===================="
          base64 -w 0 upload-keystore.jks
          echo ""
          echo "================================================================"

      - name: Upload File as Artifact (لتنزيل الملف الأصلي إذا أردت الاحتفاظ به)
        uses: actions/upload-artifact@v4
        with:
          name: original-upload-keystore
          path: upload-keystore.jks
